{% extends "base.html" %}
{% block title %}Sign in to Lectern{% endblock %}
{% block content %}
<h1>Sign in</h1>
<div class="card">
  <button id="passkey-login" type="button" class="primary">Sign in with a passkey</button>
  <p id="passkey-status" class="muted" hidden></p>
</div>
<details class="card" {% if error %}open{% endif %}>
  <summary>Use password instead</summary>
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username <input name="username" required autocomplete="username" autocapitalize="none"></label>
    <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
    <label>Authenticator code (if enabled) <input name="totp" inputmode="numeric" autocomplete="one-time-code" maxlength="8"></label>
    <button type="submit">Sign in</button>
  </form>
</details>
{% endblock %}
{% block scripts %}<script src="/static/webauthn.js" data-next="{{ next }}"></script>{% endblock %}
