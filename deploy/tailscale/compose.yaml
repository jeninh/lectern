# Lectern + Tailscale sidecar. Do not edit this file: configure it with the root `.env`
# (copy `.env.example`). Run from the repository root:
#
#   docker compose --env-file .env -f deploy/tailscale/compose.yaml up -d --build
#
# Relative paths below resolve against this file's directory (deploy/tailscale/), so
# `../..` is the repository root. Guide: docs/deploy-tailscale.md.
#
# Security design: Lectern shares the Tailscale container's network namespace and nothing
# publishes a port, so the host, the LAN, and the Internet see nothing. HTTPS comes from
# `tailscale serve` (serve.json, tailnet-only; no Funnel). tests/test_deploy_tailscale.py
# checks these invariants.

name: lectern-tailscale

services:
  tailscale:
    image: tailscale/tailscale:v1.104.1@sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d
    restart: unless-stopped
    environment:
      # Used once, at the first start; afterwards the stored node state takes over and the
      # key may be removed from .env.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-lectern}   # -> https://<TS_HOSTNAME>.<tailnet>.ts.net
      TS_STATE_DIR: /var/lib/tailscale       # node identity; keep it across restarts
      TS_AUTH_ONCE: "true"                   # reuse the stored login instead of the key
      TS_USERSPACE: "false"                  # kernel TUN: Lectern sees real peer addresses
      TS_SERVE_CONFIG: /config/serve.json
      # /healthz answers 200 once the node has a tailnet address. Loopback only: the
      # default [::]:9002 would be reachable from the tailnet.
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - ${TS_STATE_PATH:-../../data/tailscale}:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m
      start_interval: 5s
    # No `ports:` on purpose, here or below. The only way in is the tailnet. (Opt-in exception:
    # lan.yaml publishes one LAN address for e-readers at home, docs/home-network.md.)

  lectern:
    build:
      context: ../..
      args:
        # Empty = the default, slim image (no transcription, no Piper). A space- or
        # comma-separated list adds engines, e.g. "align tts" (docs/deploy-tailscale.md).
        LECTERN_EXTRAS: ${LECTERN_EXTRAS:-}
        # Pins Mac workers installed from /worker/install.sh to this code:
        #   LECTERN_COMMIT=$(git rev-parse HEAD) docker compose … up -d --build
        LECTERN_COMMIT: ${LECTERN_COMMIT:-}
    image: lectern:local
    restart: unless-stopped
    network_mode: service:tailscale          # Lectern lives inside the sidecar's network stack
    depends_on:
      tailscale:
        condition: service_healthy
        restart: true                        # the shared namespace goes away with tailscale
    user: "${LECTERN_UID:-1000}:${LECTERN_GID:-1000}"
    environment:
      LECTERN_BASE_URL: ${LECTERN_BASE_URL:?set LECTERN_BASE_URL in .env, e.g. https://lectern.tail1234.ts.net}
      # tailscale serve connects from loopback and sets X-Forwarded-For to the caller's
      # tailnet address. Nothing else is trusted, and this must not be widened.
      LECTERN_TRUSTED_PROXIES: 127.0.0.1
      LECTERN_LOG_LEVEL: ${LECTERN_LOG_LEVEL:-INFO}
      # Address baked into KOReader plugin zips; empty = the detected Tailscale IP, :8080.
      LECTERN_DEVICE_URL: ${LECTERN_DEVICE_URL:-}
      # Only used by an image built with `align` (docs/alignment.md); on a Pi: base, core count.
      LECTERN_ALIGN_MODEL: ${LECTERN_ALIGN_MODEL:-small}
      LECTERN_ALIGN_THREADS: ${LECTERN_ALIGN_THREADS:-0}
      # Resource limits of the server's own heavy jobs (docs/resource-limits.md); empty = the
      # Raspberry Pi 4B defaults (one heavy job at a time, each capped).
      LECTERN_HEAVY_JOBS_MAX: ${LECTERN_HEAVY_JOBS_MAX:-}
      LECTERN_KOKORO_CONCURRENCY: ${LECTERN_KOKORO_CONCURRENCY:-}
      LECTERN_KOKORO_THREADS: ${LECTERN_KOKORO_THREADS:-}
      LECTERN_KOKORO_MEMORY_LIMIT_MB: ${LECTERN_KOKORO_MEMORY_LIMIT_MB:-}
      LECTERN_KOKORO_NICE: ${LECTERN_KOKORO_NICE:-}
      LECTERN_PIPER_CONCURRENCY: ${LECTERN_PIPER_CONCURRENCY:-}
      LECTERN_PIPER_THREADS: ${LECTERN_PIPER_THREADS:-}
      LECTERN_PIPER_MEMORY_LIMIT_MB: ${LECTERN_PIPER_MEMORY_LIMIT_MB:-}
      LECTERN_PIPER_NICE: ${LECTERN_PIPER_NICE:-}
      LECTERN_OCR_CONCURRENCY: ${LECTERN_OCR_CONCURRENCY:-}
      LECTERN_OCR_THREADS: ${LECTERN_OCR_THREADS:-}
      LECTERN_OCR_MEMORY_LIMIT_MB: ${LECTERN_OCR_MEMORY_LIMIT_MB:-}
      LECTERN_OCR_NICE: ${LECTERN_OCR_NICE:-}
      LECTERN_CONVERT_CONCURRENCY: ${LECTERN_CONVERT_CONCURRENCY:-}
      LECTERN_CONVERT_MEMORY_LIMIT_MB: ${LECTERN_CONVERT_MEMORY_LIMIT_MB:-}
      LECTERN_CONVERT_NICE: ${LECTERN_CONVERT_NICE:-}
      LECTERN_ALIGN_CONCURRENCY: ${LECTERN_ALIGN_CONCURRENCY:-}
      LECTERN_ALIGN_MEMORY_LIMIT_MB: ${LECTERN_ALIGN_MEMORY_LIMIT_MB:-}
      LECTERN_ALIGN_NICE: ${LECTERN_ALIGN_NICE:-}
      LECTERN_TRANSCODE_CONCURRENCY: ${LECTERN_TRANSCODE_CONCURRENCY:-}
      LECTERN_TRANSCODE_THREADS: ${LECTERN_TRANSCODE_THREADS:-}
      LECTERN_TRANSCODE_MEMORY_LIMIT_MB: ${LECTERN_TRANSCODE_MEMORY_LIMIT_MB:-}
      LECTERN_TRANSCODE_NICE: ${LECTERN_TRANSCODE_NICE:-}
      # 1 = offline mode: no outbound internet connections from Lectern (docs/offline-mode.md).
      LECTERN_OFFLINE: ${LECTERN_OFFLINE:-0}
      # Admin → Storage flags a volume with less free space than this percentage (docs/storage.md).
      LECTERN_STORAGE_WARN_FREE_PERCENT: ${LECTERN_STORAGE_WARN_FREE_PERCENT:-10}
      # Email-in (docs/email-in.md): off unless LECTERN_EMAIL_IN=1. Lectern reads one mailbox
      # over IMAP with TLS (outbound only; nothing here listens for mail). Empty = default.
      LECTERN_EMAIL_IN: ${LECTERN_EMAIL_IN:-}
      LECTERN_EMAIL_IN_HOST: ${LECTERN_EMAIL_IN_HOST:-}
      LECTERN_EMAIL_IN_PORT: ${LECTERN_EMAIL_IN_PORT:-}
      LECTERN_EMAIL_IN_USER: ${LECTERN_EMAIL_IN_USER:-}
      LECTERN_EMAIL_IN_PASSWORD: ${LECTERN_EMAIL_IN_PASSWORD:-}
      LECTERN_EMAIL_IN_ADDRESS: ${LECTERN_EMAIL_IN_ADDRESS:-}
      LECTERN_EMAIL_IN_MAILBOX: ${LECTERN_EMAIL_IN_MAILBOX:-}
      LECTERN_EMAIL_IN_POLL_MINUTES: ${LECTERN_EMAIL_IN_POLL_MINUTES:-}
      LECTERN_EMAIL_IN_MAX_MB: ${LECTERN_EMAIL_IN_MAX_MB:-}
      LECTERN_EMAIL_IN_SENDER_MODE: ${LECTERN_EMAIL_IN_SENDER_MODE:-}
      LECTERN_EMAIL_IN_SENDERS: ${LECTERN_EMAIL_IN_SENDERS:-}
    # Create data and library yourself, owned by LECTERN_UID:LECTERN_GID. Docker would
    # otherwise create them owned by root, and Lectern could not write to them.
    volumes:
      - type: bind
        source: ${LECTERN_DATA_PATH:-../../data/lectern}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${LECTERN_LIBRARY_PATH:-../../library}
        target: /library
        bind:
          create_host_path: false
      # Backup target (Admin → Backups, off by default), e.g. a USB drive on a Pi. Created
      # if missing so upgrades start without it; chown it to LECTERN_UID:LECTERN_GID before
      # turning backups on (docs/backups.md).
      - type: bind
        source: ${LECTERN_BACKUP_PATH:-../../backups}
        target: /backups
        bind:
          create_host_path: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
