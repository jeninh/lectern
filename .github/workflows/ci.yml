name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    # Usually ~10 min; a stuck apt mirror otherwise holds the job for GitHub's 6 h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Install ffmpeg (audio ingest, transcode, and range tests), Noto CJK (generated covers), LuaJIT with LuaSocket/cjson (KOReader plugin), and restic (backups)
        timeout-minutes: 15
        run: |
          # A slow or stuck Ubuntu mirror would otherwise hang here: bounded attempts, retried.
          apt() { sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=60 "$@"; }
          for i in 1 2 3; do
            apt update -q && apt install -y -q --no-install-recommends ffmpeg fonts-noto-cjk luajit lua-socket lua-cjson restic && exit 0
            echo "apt attempt $i failed; retrying"; sleep 10
            sudo dpkg --configure -a || true  # a killed install leaves dpkg interrupted
          done
          exit 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Fetch epubcheck (pinned)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/epubcheck.zip" \
            https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          echo "33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c  $RUNNER_TEMP/epubcheck.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          echo "EPUBCHECK_JAR=$RUNNER_TEMP/epubcheck-5.4.0/epubcheck.jar" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest
        env:
          EPUBCHECK_REQUIRED: "1"
          # tests/test_covergen.py checks Japanese glyphs; never skip it here.
          CJK_FONTS_REQUIRED: "1"
          # tests/test_deploy_tailscale.py runs `docker compose config`; never skip it here.
          COMPOSE_REQUIRED: "1"
          # tests/test_koplugin.py runs the KOReader plugin under LuaJIT; never skip it here.
          LUAJIT_REQUIRED: "1"
          # tests/test_backups.py round-trips a restic repository; never skip it here.
          RESTIC_REQUIRED: "1"
  # Playwright against seeded servers: the desktop suite (frontend/e2e/serve.sh: multi-select in
  # the Library, Trash, Review before filing) and the installed app on phones (docs/offline.md#tests:
  # iPhone 15 on WebKit, Pixel 7 on Chromium, offline mode included; frontend/e2e/serve.py).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Install ffmpeg (the seeded audiobook's data-saver copy)
        timeout-minutes: 15
        run: |
          # A slow or stuck Ubuntu mirror would otherwise hang here: bounded attempts, retried.
          apt() { sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=60 "$@"; }
          for i in 1 2 3; do
            apt update -q && apt install -y -q --no-install-recommends ffmpeg && exit 0
            echo "apt attempt $i failed; retrying"; sleep 10
            sudo dpkg --configure -a || true  # a killed install leaves dpkg interrupted
          done
          exit 1
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - name: Install Playwright browsers (Chromium for desktop and Android, WebKit for iPhone)
        run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: |
            frontend/playwright-report/
            frontend/e2e-screenshots/
            frontend/test-results/
          retention-days: 14
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # "align tts": both on one server (a Pi aligning and narrating while the Mac is off).
        extras: ["", "align", "tts", "align tts"]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg "LECTERN_EXTRAS=${{ matrix.extras }}" -t lectern:ci .
      - name: CLI and optional transcription import
        run: |
          docker run --rm lectern:ci lectern worker --help
          docker run --rm lectern:ci lectern restore --help > /dev/null
          docker run --rm lectern:ci restic version
          docker run --rm lectern:ci python -c "from lectern.align.transcribe import transcription_available as t; print('faster-whisper:', t()); assert t() == ('align' in '${{ matrix.extras }}'.split())"
      - name: Piper (generated audiobooks) is in the tts images only
        run: docker run --rm lectern:ci python -c "from lectern.tts.engines import piper_installed as p; print('piper:', p()); assert p() == ('tts' in '${{ matrix.extras }}'.split())"
      - name: Generated covers render in the image (bundled fonts + Noto CJK)
        run: docker run --rm lectern:ci python -c "from lectern import covergen as c; assert c._cjk_font_files(); [c.render_jpeg(c.design_for(t, a)) for t, a in (('吾輩は猫である', '夏目漱石'), ('الكتاب المقدس', ''), ('ⲁⲓⲝⲟⲙ', ''))]"
  # The images a Raspberry Pi builds from deploy/tailscale/compose.yaml, linux/arm64 under
  # QEMU: the default extras, and "align,tts" (comma form) for a Pi that aligns and narrates
  # by itself when the Mac worker is off. Blocking like every other job; nothing is pushed.
  arm64:
    runs-on: ubuntu-latest
    # Two emulated builds: the default image, then align+tts.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Validate deploy/tailscale (compose and serve.json)
        run: |
          docker compose version
          for env in tests/fixtures/deploy/tailscale.env .env.example; do
            docker compose --env-file "$env" -f deploy/tailscale/compose.yaml config --quiet
          done
          jq -e . deploy/tailscale/serve.json > /dev/null
      - name: Recreate a deployed checkout (root-only Tailscale state in the build context)
        run: |
          mkdir -p data/lectern library/_inbox
          sudo install -d -m 700 data/tailscale
          sudo touch data/tailscale/tailscaled.state
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/arm64 (default image)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: lectern:arm64
          cache-from: type=gha,scope=lectern-arm64
          cache-to: type=gha,scope=lectern-arm64,mode=max
      - name: Smoke test on arm64 (emulated)
        run: |
          set -eu
          test "$(docker image inspect lectern:arm64 --format '{{.Architecture}}')" = arm64
          test "$(docker run --rm lectern:arm64 uname -m)" = aarch64
          docker run --rm lectern:arm64 lectern worker --help > /dev/null
          docker run --rm lectern:arm64 restic version
          docker run --rm lectern:arm64 python -c "from lectern.align.transcribe import transcription_available as t; assert not t()"
          docker run --rm lectern:arm64 python -c "from lectern import covergen as c; assert c._cjk_font_files(); c.render_jpeg(c.design_for('吾輩は猫である', '夏目漱石'))"
          # Run it the way deploy/tailscale/compose.yaml does: non-default UID/GID owning
          # bind-mounted data and library, read-only root, no capabilities.
          mkdir -p "$RUNNER_TEMP/smoke/data" "$RUNNER_TEMP/smoke/library"
          sudo chown -R 1001:1002 "$RUNNER_TEMP/smoke"
          docker run -d --name smoke --user 1001:1002 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e LECTERN_BASE_URL=https://lectern.tail1234.ts.net -e LECTERN_TRUSTED_PROXIES=127.0.0.1 \
            -v "$RUNNER_TEMP/smoke/data:/data" -v "$RUNNER_TEMP/smoke/library:/library" \
            lectern:arm64
          for i in $(seq 60); do
            if docker exec smoke python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=3)" 2>/dev/null; then
              break
            fi
            sleep 5
          done
          docker logs smoke 2>&1 | tail -n 40
          docker exec smoke python -c "import urllib.request as u; assert u.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200"
          docker logs smoke 2>&1 | grep -A3 "FIRST-RUN SETUP" | grep -q "https://lectern.tail1234.ts.net/setup?token="
          sudo test -s "$RUNNER_TEMP/smoke/data/lectern.db"   # written as UID 1001 via the bind mount
          docker rm -f smoke
      - name: Build linux/arm64 (align and tts)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: lectern:arm64-align-tts
          build-args: LECTERN_EXTRAS=align,tts
          cache-from: type=gha,scope=lectern-arm64-align-tts
          cache-to: type=gha,scope=lectern-arm64-align-tts,mode=max
      - name: Smoke test align and tts on arm64 (emulated)
        run: |
          set -eu
          test "$(docker image inspect lectern:arm64-align-tts --format '{{.Architecture}}')" = arm64
          docker run --rm lectern:arm64-align-tts python -c "from lectern.align.transcribe import transcription_available as t; assert t()"
          docker run --rm lectern:arm64-align-tts python -c "from lectern.tts.engines import piper_installed as p; assert p()"
          # Import the native engines, not just the package metadata: CTranslate2 and Piper's ONNX runtime.
          docker run --rm lectern:arm64-align-tts python -c "import ctranslate2, faster_whisper, onnxruntime, piper"
