services:
  lectern:
    build: .
    image: lectern:local
    container_name: lectern
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # put a TLS-terminating reverse proxy in front; passkeys need HTTPS
    environment:
      LECTERN_BASE_URL: ${LECTERN_BASE_URL:-https://lectern.example}
      # Set to "1" only for local http testing; it un-sets the Secure cookie flag.
      LECTERN_INSECURE_HTTP: ${LECTERN_INSECURE_HTTP:-0}
      LECTERN_LOG_LEVEL: ${LECTERN_LOG_LEVEL:-INFO}
      # Reverse proxy addresses whose X-Forwarded-For to believe (see README and
      # docs/deploy-tailscale.md). Empty trusts nobody.
      LECTERN_TRUSTED_PROXIES: ${LECTERN_TRUSTED_PROXIES:-}
      # Only for Cloudflare Tunnel with the connector alone in LECTERN_TRUSTED_PROXIES.
      LECTERN_TRUST_CF_CONNECTING_IP: ${LECTERN_TRUST_CF_CONNECTING_IP:-0}
      # 1 = offline mode: no outbound internet connections from Lectern (docs/offline-mode.md).
      LECTERN_OFFLINE: ${LECTERN_OFFLINE:-0}
      # Admin → Storage flags a volume with less free space than this percentage (docs/storage.md).
      LECTERN_STORAGE_WARN_FREE_PERCENT: ${LECTERN_STORAGE_WARN_FREE_PERCENT:-10}
    volumes:
      - lectern-data:/data
      - ./library:/library
      - ./backups:/backups   # opt-in backups (docs/backups.md); owned by UID 1000
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  lectern-data:
