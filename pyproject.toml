[project]
name = "lectern"
version = "0.1.0"
description = "Self-hosted reading server: library, OPDS catalog, KOReader sync, and text/audio alignment."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "lxml>=5.2",
    "mutagen>=1.47",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "webauthn>=2.1",
    "rapidfuzz>=3.9",
    "itsdangerous>=2.2",
    "pillow>=10.3",
    "mcp>=2.3,<3",
    "resvg-py>=0.5",
    "fonttools>=4.50",
    "pypdf>=5.1",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "hypothesis>=6.100",
    # Streaming decode and windowing tests (no model needed). Same pin as the align extra.
    "av>=11,<19",
    "numpy>=1.26",
]
# Transcription and the external worker (`lectern worker`). PyAV 19 breaks faster-whisper 1.2.
align = [
    "av>=11,<19",
    "faster-whisper>=1.1",
    "httpx>=0.27",
]

# The Mac worker (docs/mac-worker.md): MLX alignment on the Apple GPU, Kokoro TTS, the
# menu bar. Everything Mac-only is behind markers, so the extra installs anywhere and the
# CPU engine (faster-whisper) is the fallback.
mac = [
    "av>=11,<19",
    "faster-whisper>=1.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "kokoro>=0.9; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "rumps>=0.4; sys_platform == 'darwin'",
]

[project.scripts]
lectern = "lectern.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lectern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:lectern.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
